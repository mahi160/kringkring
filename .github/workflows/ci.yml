name: CI and release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +1.100.0 fmt --check
      - name: Check Clippy
        run: cargo +1.100.0 clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo +1.100.0 test --locked

  # The office container pulls this release every 5 minutes (infra/kringkring-update).
  # Nothing here connects to the office network.
  main-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    concurrency:
      group: main-build
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test in Alpine
        run: sh scripts/build-release.sh x86_64-unknown-linux-musl
      - name: Publish the kringkring-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset=dist/kringkring-x86_64-unknown-linux-musl
          gh release delete kringkring-build --cleanup-tag --yes || true
          gh release create kringkring-build "$asset" "$asset.sha256" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title 'Latest main build' --notes "Built from $GITHUB_SHA"

  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test in Alpine
        env:
          TARGET: ${{ matrix.target }}
        run: sh scripts/build-release.sh "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kringkring-${{ matrix.target }}
          path: dist/kringkring-${{ matrix.target }}*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: kringkring-*
          merge-multiple: true
          path: dist
      - name: Verify and publish release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          amd64=kringkring-x86_64-unknown-linux-musl
          arm64=kringkring-aarch64-unknown-linux-musl
          sha256sum -c "$amd64.sha256" "$arm64.sha256"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest \
            "$amd64" "$amd64.sha256" "$arm64" "$arm64.sha256"
