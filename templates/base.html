<!doctype html>
<html lang="{{ lang.code() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>{% block title %}{{ lang.brand() }}{% endblock %}</title>
  {% block meta %}{% endblock %}
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/assets/metro.css">
</head>
<body>
  <a class="skip" href="#main">{{ lang.catalog().skip }}</a>
  <header class="shell-header">
    <div class="frame header-row">
      <span class="wordmark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 16h12l-1.5-3V10a4.5 4.5 0 0 0-9 0v3L6 16Zm4 3h4M4 9l1-3m15 3-1-3"/>
        </svg>
        <span lang="bn">{{ lang.brand() }}</span>
      </span>
      <form class="header-controls" action="/language" method="post">
        {% block extra_controls %}{% endblock %}
        <input type="hidden" name="page" value="{% block return_page %}login{% endblock %}">
        <button class="language-toggle" type="submit" name="lang" value="{{ lang.other().code() }}" lang="{{ lang.other().code() }}" aria-label="{{ lang.catalog().switch_title }}">{{ lang.catalog().switch_language }}</button>
        {% include "theme_toggle.html" %}
      </form>
    </div>
  </header>
  <main id="main" class="frame {% block layout %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
